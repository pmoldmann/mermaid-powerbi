<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 260">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2D3748"/>
      <stop offset="100%" style="stop-color:#1A202C"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="5" y="5" width="210" height="250" rx="14" fill="url(#bgGrad)"/>

  <!-- Icon group: scaled 1.5x, centered horizontally at x=110, vertically at y=72 -->
  <g transform="translate(110, 72) scale(1.5) translate(-50, -50)">
    <!-- Markdown "M" symbol -->
    <path d="M20 70V30H28L38 50L48 30H56V70H48V45L38 65L28 45V70H20Z" fill="#E2E8F0"/>
    <!-- Mermaid flow boxes -->
    <rect x="62" y="30" width="18" height="12" rx="2" fill="#4FD1C5"/>
    <rect x="62" y="58" width="18" height="12" rx="2" fill="#4FD1C5"/>
    <!-- Connecting arrow -->
    <path d="M71 42V52M71 52L66 47M71 52L76 47" stroke="#4FD1C5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Title line 1 -->
  <text
    x="110"
    y="140"
    text-anchor="middle"
    font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif"
    font-size="18"
    font-weight="700"
    fill="#E2E8F0"
    letter-spacing="0.3"
  >Markdown / Mermaid</text>

  <!-- Title line 2 -->
  <text
    x="110"
    y="162"
    text-anchor="middle"
    font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif"
    font-size="18"
    font-weight="700"
    fill="#E2E8F0"
    letter-spacing="0.3"
  >Renderer</text>

  <!-- Subtitle line 1 -->
  <text
    x="110"
    y="195"
    text-anchor="middle"
    font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif"
    font-size="11"
    font-weight="400"
    fill="#4FD1C5"
    letter-spacing="0.4"
  >Use markdown within</text>

  <!-- Subtitle line 2 -->
  <text
    x="110"
    y="211"
    text-anchor="middle"
    font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif"
    font-size="11"
    font-weight="400"
    fill="#4FD1C5"
    letter-spacing="0.4"
  >Power BI reports</text>
</svg>
